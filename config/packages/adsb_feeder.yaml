# =============================================================================
# ADS-B & AIS feeder — Raspberry Pi "adsb"
# =============================================================================
# Statistik från flygplans- och fartygsmottagaren. Pi:n serverar allt över HTTP;
# ingen integration, inget tillägg och inga inloggningsuppgifter behövs.
#
# Källor:
#   http://192.168.1.111/readsb/stats.json       readsb: brus, avkodning, signal
#   http://192.168.1.111/readsb/aircraft.json    readsb: flygplan just nu
#   http://192.168.1.111:8754/monitor.json       fr24feed: länken till FR24
#   http://192.168.1.111:8100/api/stat.json      AIS-catcher: fartyg
#
# Adressen är WiFi-gränssnittet (Fixed IP i UniFi mot 88:a2:9e:fe:66:46).
# Pi:n har även 192.168.1.21 på eth0, men nätverkskabeln sitter inte alltid i.
#
# readsb serverar inte själv över HTTP — ett lighttpd-alias exponerar
# /run/readsb. Se ~/project/fr24-feeder, rollen `readsb`.
#
# VIKTIGAST AV SENSORERNA: brusgolvet.
# Det är den enda mätpunkten som avslöjar överstyrning orsakad av starka
# signaler UTANFÖR 1090 MHz, vilket `strong_signals` missar helt. Den
# 3 september 2026 steg brusgolvet från -38 till -22 dB efter att mottagaren
# flyttats utan att gain trimmades om. ADS-B tappade 97 % av sin avkodning,
# och det upptäcktes först ett dygn senare via Flightradar24:s egen statistik.
#
#   friskt      -38 till -44 dB
#   förhöjt     -35 till -30 dB   störkälla nära, eller gain något för hög
#   överstyrt   över -30 dB       gain klart för hög, eller stark störning
# =============================================================================

rest:
  # --- readsb: mottagarhälsa och avkodning ----------------------------------
  - resource: http://192.168.1.111/readsb/stats.json
    scan_interval: 60
    timeout: 10
    sensor:
      - name: "ADS-B brusgolv"
        unique_id: adsb_noise_floor
        value_template: "{{ value_json.last1min.local.noise | float(0) | round(1) }}"
        unit_of_measurement: "dB"
        state_class: measurement
        icon: mdi:waveform

      - name: "ADS-B meddelanden per minut"
        unique_id: adsb_messages_per_minute
        value_template: >-
          {{ value_json.last1min.local.accepted | default([0], true) | sum }}
        unit_of_measurement: "msg/min"
        state_class: measurement
        icon: mdi:radio-tower

      - name: "ADS-B toppsignal"
        unique_id: adsb_peak_signal
        value_template: "{{ value_json.last1min.local.peak_signal | float(0) | round(1) }}"
        unit_of_measurement: "dBFS"
        state_class: measurement
        icon: mdi:signal

      # Antal flygplan sedan readsb startade. readsb räknar "spår", och drar
      # man inte bort enmeddelandespåren får man ett tal som är tjugo gånger
      # för högt: 2188 mot 103. Ett enmeddelandespår är en ICAO-kod som
      # avkodats en enda gång och aldrig återkom — nästan alltid en
      # CRC-korrigerad falsk träff, inte ett flygplan.
      #
      # VIKTIGT: skillnaden är INTE monotont växande, och får därför inte
      # deklareras `total_increasing`. readsb räknar upp `all` när ett spår
      # SKAPAS men `single_message` först när spåret ÅLDRAS UT, så de två
      # löper osynkroniserat och differensen svänger ±10 mellan avläsningar:
      #
      #   15:30:04  all=2208  single=2107  diff=101
      #   15:30:29  all=2213  single=2115  diff= 98
      #   15:30:54  all=2214  single=2120  diff= 94
      #   15:31:19  all=2219  single=2122  diff= 97
      #
      # Med `total_increasing` tolkade HA varje sådan svacka som en
      # nollställning av mätaren och lade till hela värdet igen på vägen upp.
      # Den 4 september 2026 stod dygnsmätaren på 256 medan källan stod på
      # 106 — dygnssumman var alltså större än totalen den räknade på.
      #
      # Sensorn behålls som ögonblicksvärde (`measurement`). Den ackumulerande
      # räkningen görs av `sensor.flygplan_ackumulerat` längre ned, som filtrerar
      # bort svackorna.
      - name: "Flygplan totalt"
        unique_id: adsb_aircraft_total
        value_template: >-
          {{ (value_json.total.tracks.all | int(0))
             - (value_json.total.tracks.single_message | int(0)) }}
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:counter

      # readsb-processens starttid som unix-tid. Ändras bara när readsb startas
      # om, och är därmed den exakta signalen för "räknarna började om från noll"
      # — bättre än att gissa utifrån hur mycket värdet föll.
      - name: "ADS-B sessionsstart"
        unique_id: adsb_session_start
        value_template: "{{ value_json.total.start | int(0) }}"
        icon: mdi:clock-start

      # Längsta avstånd sedan readsb startade. readsb rapporterar meter.
      - name: "ADS-B max avstånd"
        unique_id: adsb_max_distance
        value_template: "{{ (value_json.total.max_distance | float(0) / 1852) | round(1) }}"
        unit_of_measurement: "nm"
        state_class: measurement
        icon: mdi:arrow-expand-horizontal

      # Tappade samples är den definitiva indikatorn på USB- eller värmeproblem.
      # Ska vara noll. 5,25 miljarder samples utan en enda tappad är normalt.
      - name: "ADS-B tappade samples"
        unique_id: adsb_samples_dropped
        value_template: "{{ value_json.total.local.samples_dropped | int(0) }}"
        state_class: total_increasing
        icon: mdi:alert-circle-outline

  # --- readsb: flygplan just nu ----------------------------------------------
  - resource: http://192.168.1.111/readsb/aircraft.json
    scan_interval: 30
    timeout: 10
    sensor:
      - name: "Flygplan spårade"
        unique_id: adsb_aircraft_tracked
        value_template: "{{ value_json.aircraft | length }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:airplane

      - name: "Flygplan med position"
        unique_id: adsb_aircraft_with_position
        value_template: >-
          {{ value_json.aircraft | selectattr('lat', 'defined') | list | length }}
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:map-marker-radius

  # --- Flightradar24-länken ---------------------------------------------------
  - resource: http://192.168.1.111:8754/monitor.json
    scan_interval: 60
    timeout: 10
    sensor:
      # Fälten är strängar i fr24feeds JSON, därav int-konverteringen.
      - name: "FR24 flygplan skickade"
        unique_id: fr24_aircraft_sent
        value_template: "{{ value_json.feed_num_ac_tracked | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:upload-network
    binary_sensor:
      - name: "FR24 feeder ansluten"
        unique_id: fr24_feed_connected
        value_template: "{{ value_json.feed_status == 'connected' }}"
        device_class: connectivity

  # --- AIS ---------------------------------------------------------------------
  - resource: http://192.168.1.111:8100/api/stat.json
    scan_interval: 60
    timeout: 10
    sensor:
      - name: "AIS spårade objekt"
        unique_id: ais_vessel_count
        value_template: "{{ value_json.vessel_count | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:ferry

      - name: "AIS meddelanden per sekund"
        unique_id: ais_message_rate
        value_template: "{{ value_json.msg_rate | float(0) | round(2) }}"
        unit_of_measurement: "msg/s"
        state_class: measurement
        icon: mdi:radio-tower

# Monotont växande räkning av flygplan, byggd på råvärdet ovan.
#
# Råvärdet svänger nedåt när readsb åldrar ut falska spår, men det är en
# eftersläpning i mätningen — antalet flygplan som passerat kan inte minska.
# Därför förs en högvattenmärkning (`hwm`): bara det som överstiger det
# högsta tidigare värdet räknas som nya flygplan. Svackorna passerar spårlöst.
#
# En omstart av readsb nollställer råvärdet, och känns igen exakt på att
# `sensor.ads_b_sessionsstart` ändrats — då läggs hela det nya råvärdet till
# i stället för differensen.
#
# Ett tomt `session`-attribut betyder "första avläsningen", inte "readsb har
# startat om" — REST-sensorn för sessionsstart hinner vara `unknown` när den
# första triggern går. Utan det undantaget lade sensorn till hela råvärdet en
# extra gång direkt efter varje omladdning av konfigurationen.
#
# Trigger-baserade template-sensorer återställer sitt tillstånd efter en
# HA-omstart, så både summan och `hwm` överlever. Skulle de ändå saknas
# börjar sensorn om från råvärdet i stället för att dubbelräkna.
template:
  - trigger:
      - platform: state
        entity_id: sensor.flygplan_totalt
    sensor:
      - name: "Flygplan ackumulerat"
        unique_id: adsb_aircraft_cumulative
        unit_of_measurement: "st"
        state_class: total_increasing
        icon: mdi:counter
        state: >-
          {% set raw = states('sensor.flygplan_totalt') | int(-1) %}
          {% set prev = this.state | int(-1) %}
          {% set hwm = this.attributes.get('hwm', -1) | int(-1) %}
          {% set prev_session = this.attributes.get('session', '') | string %}
          {% set s = states('sensor.ads_b_sessionsstart') %}
          {% set session = s if s not in ['unknown', 'unavailable', ''] else prev_session %}
          {% if raw < 0 %}
            {{ prev if prev >= 0 else 0 }}
          {% elif prev < 0 or hwm < 0 %}
            {{ raw }}
          {% elif prev_session != '' and session != prev_session %}
            {{ prev + raw }}
          {% elif raw > hwm %}
            {{ prev + raw - hwm }}
          {% else %}
            {{ prev }}
          {% endif %}
        attributes:
          hwm: >-
            {% set raw = states('sensor.flygplan_totalt') | int(-1) %}
            {% set hwm = this.attributes.get('hwm', -1) | int(-1) %}
            {% set prev_session = this.attributes.get('session', '') | string %}
            {% set s = states('sensor.ads_b_sessionsstart') %}
            {% set session = s if s not in ['unknown', 'unavailable', ''] else prev_session %}
            {% if raw < 0 %}
              {{ hwm if hwm >= 0 else 0 }}
            {% elif hwm < 0 or (prev_session != '' and session != prev_session) or raw > hwm %}
              {{ raw }}
            {% else %}
              {{ hwm }}
            {% endif %}
          session: >-
            {% set prev_session = this.attributes.get('session', '') | string %}
            {% set s = states('sensor.ads_b_sessionsstart') %}
            {{ s if s not in ['unknown', 'unavailable', ''] else prev_session }}

# Dygns- och månadsvis antal flygplan, byggt på den ackumulerande sensorn ovan.
# Källan måste vara monotont växande — se kommentaren vid `Flygplan totalt` för
# vad som händer när den inte är det.
utility_meter:
  flygplan_per_dygn:
    source: sensor.flygplan_ackumulerat
    name: Flygplan per dygn
    cycle: daily

  flygplan_per_manad:
    source: sensor.flygplan_ackumulerat
    name: Flygplan per månad
    cycle: monthly

automation:
  # Larmet som hade fångat den 3 september inom en kvart i stället för ett dygn.
  # `for` är avsiktligt satt till 15 minuter: brusgolvet fluktuerar kortvarigt,
  # och ett larm som utlöses av en minuts avvikelse blir självt till brus.
  - id: adsb_noise_floor_elevated
    alias: "ADS-B: brusgolvet har stigit"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.ads_b_brusgolv
        above: -35
        for: "00:15:00"
    action:
      - service: persistent_notification.create
        data:
          title: "ADS-B: förhöjt brusgolv"
          message: >-
            Brusgolvet ligger på {{ states('sensor.ads_b_brusgolv') }} dB
            (friskt: -38 till -44). Antingen är gain för hög, eller så finns en
            störkälla nära antennen. Kör `sudo fr24-health` på adsb.

  - id: adsb_feed_disconnected
    alias: "ADS-B: feedern tappade anslutningen till FR24"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.fr24_feeder_ansluten
        to: "off"
        for: "00:10:00"
    action:
      - service: persistent_notification.create
        data:
          title: "FR24: feedern är frånkopplad"
          message: >-
            fr24feed har varit frånkopplad i tio minuter. Kontrollera att
            Raspberry Pi:n svarar och att readsb kör.
