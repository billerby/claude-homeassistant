# =============================================================================
# ADS-B & AIS feeder — Raspberry Pi "adsb"
# =============================================================================
# Statistik från flygplans- och fartygsmottagaren. Pi:n serverar allt över HTTP;
# ingen integration, inget tillägg och inga inloggningsuppgifter behövs.
#
# Källor:
#   http://192.168.1.111/readsb/stats.json       readsb: brus, avkodning, signal
#   http://192.168.1.111/readsb/tracked.json     VILKA flygplan och fartyg
#   http://192.168.1.111/readsb/unique.json      unika flygplan per dygn/månad
#   http://192.168.1.111:8754/monitor.json       fr24feed: länken till FR24
#   http://192.168.1.111:8100/api/stat.json      AIS-catcher: statistik
#
# Adressen är WiFi-gränssnittet (Fixed IP i UniFi mot 88:a2:9e:fe:66:46).
# Pi:n har även 192.168.1.21 på eth0, men nätverkskabeln sitter inte alltid i.
#
# readsb serverar inte själv över HTTP — ett lighttpd-alias exponerar
# /run/readsb. Se ~/project/fr24-feeder, rollen `readsb`.
#
# VIKTIGAST AV SENSORERNA: brusgolvet.
# Det är den enda mätpunkten som avslöjar överstyrning orsakad av starka
# signaler UTANFÖR 1090 MHz, vilket `strong_signals` missar helt. Den
# 3 september 2026 steg brusgolvet från -38 till -22 dB efter att mottagaren
# flyttats utan att gain trimmades om. ADS-B tappade 97 % av sin avkodning,
# och det upptäcktes först ett dygn senare via Flightradar24:s egen statistik.
#
#   friskt      -38 till -44 dB
#   förhöjt     -35 till -30 dB   störkälla nära, eller gain något för hög
#   överstyrt   över -30 dB       gain klart för hög, eller stark störning
# =============================================================================

rest:
  # --- readsb: mottagarhälsa och avkodning ----------------------------------
  - resource: http://192.168.1.111/readsb/stats.json
    scan_interval: 60
    timeout: 10
    sensor:
      - name: "ADS-B brusgolv"
        unique_id: adsb_noise_floor
        value_template: "{{ value_json.last1min.local.noise | float(0) | round(1) }}"
        unit_of_measurement: "dB"
        state_class: measurement
        icon: mdi:waveform

      - name: "ADS-B meddelanden per minut"
        unique_id: adsb_messages_per_minute
        value_template: >-
          {{ value_json.last1min.local.accepted | default([0], true) | sum }}
        unit_of_measurement: "msg/min"
        state_class: measurement
        icon: mdi:radio-tower

      - name: "ADS-B toppsignal"
        unique_id: adsb_peak_signal
        value_template: "{{ value_json.last1min.local.peak_signal | float(0) | round(1) }}"
        unit_of_measurement: "dBFS"
        state_class: measurement
        icon: mdi:signal

      # Längsta avstånd sedan readsb startade. readsb rapporterar meter.
      - name: "ADS-B max avstånd"
        unique_id: adsb_max_distance
        value_template: "{{ (value_json.total.max_distance | float(0) / 1852) | round(1) }}"
        unit_of_measurement: "nm"
        state_class: measurement
        icon: mdi:arrow-expand-horizontal

      # Tappade samples är den definitiva indikatorn på USB- eller värmeproblem.
      # Ska vara noll. 5,25 miljarder samples utan en enda tappad är normalt.
      - name: "ADS-B tappade samples"
        unique_id: adsb_samples_dropped
        value_template: "{{ value_json.total.local.samples_dropped | int(0) }}"
        state_class: total_increasing
        icon: mdi:alert-circle-outline

  # --- Vilka som spåras just nu -----------------------------------------------
  # Ersätter den tidigare hämtningen av aircraft.json. Tjänsten `feeder-tracked`
  # på Pi:n slår ihop readsbs flygplan och AIS-catchers fartyg till en fil, och
  # gör tre saker som är obekväma i en Jinja-mall:
  #
  #   * översätter AIS-koderna — shiptype 60 är "Passagerarfartyg", och
  #     mmsi 992651007 är inte ett fartyg alls utan ett virtuellt sjömärke
  #   * räknar avstånd och bäring från mottagarens position, i nautiska mil
  #   * kastar de fält inget kort visar: ships.json är 20 kB, tracked.json 6 kB
  #
  # unique_id:na är desamma som när sensorerna hämtades ur aircraft.json, så
  # historiken i recorder följer med. Se ~/project/fr24-feeder, rollen `tracked`.
  #
  # Räknarna och listorna är skilda entiteter med flit, se kommentaren vid
  # "Flygplanslista". Listorna ligger i attributet `list`, sorterade med det
  # närmaste först, och är undantagna i recorder — se configuration.yaml.
  - resource: http://192.168.1.111/readsb/tracked.json
    scan_interval: 30
    timeout: 10
    sensor:
      - name: "Flygplan spårade"
        unique_id: adsb_aircraft_tracked
        value_template: "{{ value_json.aircraft.count | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:airplane

      - name: "Flygplan med position"
        unique_id: adsb_aircraft_with_position
        value_template: "{{ value_json.aircraft.with_position | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:map-marker-radius

      # Fartyg, till skillnad från "AIS spårade objekt" nedan: bara det som
      # faktiskt är ett fartyg, och bara det som hörts de senaste tio
      # minuterna. Talen ska inte stämma överens — se kommentaren där.
      - name: "Fartyg spårade"
        unique_id: ais_vessels_tracked
        value_template: "{{ value_json.vessels.count | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:ferry

      # Det mesta i hamnen ligger förtöjt. Gränsen går vid en halv knop, inte
      # noll, för GPS-bruset gör att stillaliggande fartyg rapporterar 0,1-0,3.
      - name: "Fartyg under gång"
        unique_id: ais_vessels_moving
        value_template: "{{ value_json.vessels.moving | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:ferry

      # --- Listorna, som egna entiteter -------------------------------------
      # Varför inte som attribut på räknarna ovan: recorder kan undanta
      # entiteter, men inte enskilda attribut. Ett `list` på "Flygplan spårade"
      # hade tvingat fram ett val mellan att spara några kilobyte var
      # trettionde sekund, eller att undanta entiteten och därmed tappa
      # 24-timmarsdiagrammet som ritar just den. Två bärare kostar två rader i
      # entitetsregistret och löser båda.
      #
      # Tillståndet är antalet, samma som räknaren - en REST-sensors tillstånd
      # får vara högst 255 tecken, så listan kan aldrig ligga där.
      - name: "Flygplanslista"
        unique_id: adsb_aircraft_list
        value_template: "{{ value_json.aircraft.count | int(0) }}"
        json_attributes_path: "$.aircraft"
        json_attributes:
          - list
          - with_position
          - max_distance_nm
        unit_of_measurement: "st"
        icon: mdi:format-list-bulleted

      - name: "Fartygslista"
        unique_id: ais_vessel_list
        value_template: "{{ value_json.vessels.count | int(0) }}"
        json_attributes_path: "$.vessels"
        json_attributes:
          - list
          - moving
          - aton
          - known
          - max_distance_nm
        unit_of_measurement: "st"
        icon: mdi:format-list-bulleted

  # --- Flightradar24-länken ---------------------------------------------------
  - resource: http://192.168.1.111:8754/monitor.json
    scan_interval: 60
    timeout: 10
    sensor:
      # Fälten är strängar i fr24feeds JSON, därav int-konverteringen.
      - name: "FR24 flygplan skickade"
        unique_id: fr24_aircraft_sent
        value_template: "{{ value_json.feed_num_ac_tracked | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:upload-network
    binary_sensor:
      - name: "FR24 feeder ansluten"
        unique_id: fr24_feed_connected
        value_template: "{{ value_json.feed_status == 'connected' }}"
        device_class: connectivity

      # Ansluten till FR24 säger inget om att det finns något att skicka.
      # rx_connected är länken fr24feed -> readsb, och den är den som bryts
      # när dongeln eller readsb faller bort. Strängen "1", inte talet.
      - name: "FR24 tar emot från readsb"
        unique_id: fr24_rx_connected
        value_template: "{{ value_json.rx_connected == '1' }}"
        device_class: connectivity

  # --- AIS ---------------------------------------------------------------------
  - resource: http://192.168.1.111:8100/api/stat.json
    scan_interval: 60
    timeout: 10
    sensor:
      # AIS-catchers eget tal: allt den håller i minnet, i 30 minuter efter
      # sista meddelandet, sjömärken och basstationer inräknade. "Fartyg
      # spårade" ovan är delmängden som är fartyg och hörts senaste tio
      # minuterna. 142 mot 23 är normalt, inte ett fel.
      - name: "AIS spårade objekt"
        unique_id: ais_vessel_count
        value_template: "{{ value_json.vessel_count | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:ferry

      - name: "AIS meddelanden per sekund"
        unique_id: ais_message_rate
        value_template: "{{ value_json.msg_rate | float(0) | round(2) }}"
        unit_of_measurement: "msg/s"
        state_class: measurement
        icon: mdi:radio-tower

  # =============================================================================
  # Unika flygplan per dygn och månad
  # =============================================================================
  # Räkningen görs på Pi:n av tjänsten `adsb-unique-count`, som samlar
  # ICAO-adresserna ur aircraft.json. Se ~/project/fr24-feeder, rollen
  # `unique_count`.
  #
  # Varför inte i Home Assistant: readsbs egen statistik kan inte svara på
  # frågan. `total.tracks.all` räknar spår, inte flygplan, och nästan alla spår
  # är CRC-korrigerade enmeddelandespöken. Differensen `all - single_message`
  # ser ut som ett antal flygplan men är en jämviktsnivå kring 105 som inte
  # växer - uppmätt 4 september 2026 växte `all` med 56 och `single_message` med
  # 55 på sju minuter medan differensen stod stilla:
  #
  #   16:36:49  all=2838  single=2733  diff=105
  #   16:39:49  all=2864  single=2759  diff=105
  #   16:43:34  all=2894  single=2788  diff=106
  #
  # En sensor byggd på den differensen visade 124 flygplan samma dygn som
  # Flightradar24 rapporterade 72. Den är borttagen, liksom de utility_meter
  # som räknade på den.
  #
  # Bara ICAO-adressen identifierar ett flygplan, och unionen av adresser över
  # ett dygn är det enda som ger rätt tal.
  - resource: http://192.168.1.111/readsb/unique.json
    scan_interval: 60
    timeout: 10
    sensor:
      - name: "Flygplan i dag"
        unique_id: adsb_unique_today
        value_template: "{{ value_json.today | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:airplane-clock

      - name: "Flygplan denna månad"
        unique_id: adsb_unique_month
        value_template: "{{ value_json.this_month | int(0) }}"
        unit_of_measurement: "st"
        state_class: measurement
        icon: mdi:calendar-month

automation:
  # Larmet som hade fångat den 3 september inom en kvart i stället för ett dygn.
  # `for` är avsiktligt satt till 15 minuter: brusgolvet fluktuerar kortvarigt,
  # och ett larm som utlöses av en minuts avvikelse blir självt till brus.
  - id: adsb_noise_floor_elevated
    alias: "ADS-B: brusgolvet har stigit"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.ads_b_brusgolv
        above: -35
        for: "00:15:00"
    action:
      - service: persistent_notification.create
        data:
          title: "ADS-B: förhöjt brusgolv"
          message: >-
            Brusgolvet ligger på {{ states('sensor.ads_b_brusgolv') }} dB
            (friskt: -38 till -44). Antingen är gain för hög, eller så finns en
            störkälla nära antennen. Kör `sudo fr24-health` på adsb.

  - id: adsb_feed_disconnected
    alias: "ADS-B: feedern tappade anslutningen till FR24"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.fr24_feeder_ansluten
        to: "off"
        for: "00:10:00"
    action:
      - service: persistent_notification.create
        data:
          title: "FR24: feedern är frånkopplad"
          message: >-
            fr24feed har varit frånkopplad i tio minuter. Kontrollera att
            Raspberry Pi:n svarar och att readsb kör.

  # Larmet som hade fångat den 17 september. ADS-B-dongeln föll då av USB-bussen
  # och readsb startade om var tionde sekund i fyra dygn utan att något av
  # larmen ovan löste ut: feed_status stod kvar på connected (fr24feed pratade
  # med FR24, den hade bara inget att skicka), och brusgolvet steg inte - det
  # försvann, vilket numeric_state inte utlöser på.
  #
  # unknown OCH unavailable: recorder visar att brusgolvet stod på unknown hela
  # avbrottet. Pi:n svarade, men med lighttpds 404-sida eftersom /run/readsb
  # inte fanns. unavailable blir det bara om Pi:n inte svarar alls.
  #
  # 15 minuter på rx_connected ger fr24-watchdog (var femte minut på Pi:n) en
  # chans att laga ett fel i fr24feed innan larmet går.
  - id: adsb_readsb_no_data
    alias: "ADS-B: readsb levererar ingen data"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.ads_b_brusgolv
        to: ["unknown", "unavailable"]
        for: "00:10:00"
      - platform: state
        entity_id: binary_sensor.fr24_tar_emot_fran_readsb
        to: "off"
        for: "00:15:00"
    action:
      - service: persistent_notification.create
        data:
          title: "ADS-B: ingen data från readsb"
          message: >-
            readsb levererar inget till fr24feed. Vanligast är att dongeln
            fallit av USB. På adsb: `journalctl -u readsb -n 20` och `lsusb`.
            Syns inte serienumret 28389749, sätt dongeln i en annan port -
            readsb väljer på serienummer, så porten spelar ingen roll.
