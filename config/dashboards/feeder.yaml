# =============================================================================
# Feeder — ADS-B och AIS
# =============================================================================
# Sensorerna definieras i config/packages/adsb_feeder.yaml och läses från
# Raspberry Pi:n `adsb` över HTTP.
#
# Diagramval:
#   - Varje diagram har EN y-axel. Brusgolv (dB) och meddelanden (antal) är
#     olika storheter och delar därför inte diagram - dubbla y-axlar gör
#     kurvorna omöjliga att jämföra och antyder samband som inte finns.
#   - Enkelserie-diagram saknar legend; rubriken namnger serien.
#   - Nuläget visas som siffror, inte som diagram. En kurva över "tappade
#     samples" som alltid är noll säger ingenting.
#   - Anslutningsläget visas som tidslinje, inte som kurva.
#   - VILKA som spåras är en tabell, inte ett diagram. Namn, typ och destination
#     är nominella värden - de har ingen ordning att rita på en axel. Tabellen
#     sorteras på avstånd, vilket är det enda som går att jämföra.
#     Listorna kommer från sensor.flygplanslista och sensor.fartygslista, som
#     är skilda från räknarna för att kunna undantas i recorder.
#
# Färger:
#   Kategoriska serier använder slot 1 (#2a78d6) och slot 2 (#eb6834).
#   Paret är validerat: ΔE 24,7 vid protanopi och 33,6 vid normalseende, mot
#   målet ≥8 respektive ≥15.
#   Tröskellinjerna använder den reserverade statuspaletten och bär alltid
#   text, så färgen aldrig ensam betyder något.
# =============================================================================

title: Feeder
views:
  - title: Feeder
    path: feeder
    icon: mdi:radar
    cards:

      # --- Nuläget: siffror, inte diagram --------------------------------------
      # "Fartyg" pekar på sensor.fartyg_sparade, inte på sensor.ais_sparade_objekt
      # som tidigare. Det senare heter nu "AIS-objekt" och står kvar bredvid,
      # för de mäter olika saker och skillnaden dem emellan är stor: 26 mot 144
      # en vanlig eftermiddag. Fartyg är fartyg som hörts de senaste tio
      # minuterna; AIS-objekt är allt AIS-catcher håller i minnet i 30 minuter,
      # sjömärken och basstationer inräknade.
      - type: glance
        title: Just nu
        columns: 3
        state_color: true
        entities:
          - entity: sensor.flygplan_sparade
            name: Flygplan
          - entity: sensor.ads_b_meddelanden_per_minut
            name: Msg/min
          - entity: sensor.ads_b_brusgolv
            name: Brusgolv
          - entity: sensor.fartyg_sparade
            name: Fartyg
          - entity: sensor.fartyg_under_gang
            name: Under gång
          - entity: sensor.ais_sparade_objekt
            name: AIS-objekt
          - entity: binary_sensor.fr24_feeder_ansluten
            name: FR24
          - entity: sensor.ads_b_tappade_samples
            name: Tappade
          - entity: sensor.ads_b_max_avstand
            name: Max avstånd
          - entity: sensor.flygplan_i_dag
            name: Plan i dag
          - entity: sensor.flygplan_denna_manad
            name: Denna månad
          - entity: sensor.ais_meddelanden_per_sekund
            name: AIS msg/s

      # --- Vilka flygplan hörs just nu -----------------------------------------
      # Listan är kapad till 25 av tjänsten på Pi:n; "Flygplan spårade" i
      # glansen ovan gäller alltid allt som hörs. Att listan är tom är
      # normaltillståndet mellan passager - med 38 nm räckvidd och ett
      # sextiotal unika flygplan per dygn går det minuter mellan planen.
      #
      # Metriska enheter. Pi:n levererar flygets egna - fot, knop, sjömil - och
      # omräkningen görs här, så tracked.json förblir samma som readsb.
      # Höjden avrundas till tiotal meter: den sänds i steg om 25 fot (7,6 m),
      # så en entalssiffra vore falsk precision.
      #
      # Första kolumnen visar det första som finns av anropssignal (SAS94B),
      # registrering (SP-RKS) och ICAO-adress. Anropssignalen sänds bara var
      # femte sekund och aldrig av plan som bara svarar radar; registrering och
      # typ slås upp på Pi:n i readsbs flygplansdatabas. Adressen är sista
      # utvägen och står i kursiv, så att 48c131 inte ser ut som ett flightnummer.
      - type: markdown
        title: Flygplan just nu
        content: |
          {% set ac = state_attr('sensor.flygplanslista', 'list') %}
          {% if ac %}
          | Flight | Typ | Höjd | Fart | Avstånd |
          |---|---|--:|--:|--:|
          {% for a in ac -%}
          | {{ a.flight or a.registration or ('*' ~ a.hex ~ '*') }} | {{ a.type or '–' }} | {{ 'mark' if a.on_ground else (((a.altitude_ft * 0.3048) | round(-1) | int ~ ' m') if a.altitude_ft is not none else '–') }} | {{ ((a.speed_kt * 1.852) | round | int ~ ' km/h') if a.speed_kt is not none else '–' }} | {{ ((a.distance_nm * 1.852) | round(1) ~ ' km') if a.distance_nm is not none else '–' }} {{ a.direction or '' }} |
          {% endfor %}
          {% else %}
          Inget flygplan hörs just nu.
          {% endif %}

      # --- Vilka fartyg hörs just nu --------------------------------------------
      # Typen är översatt på Pi:n; AIS kodar den som ett tal 0-99 i
      # tiotalsgrupper. Sjömärken och basstationer är redan bortsorterade -
      # de sänder AIS men ligger still för alltid, och blandade i listan får
      # den att se ut att innehålla ett dussin fartyg som aldrig rör sig.
      #
      # `| default('–')` fungerar inte här: filtret ersätter bara det som är
      # odefinierat, och ett fält som saknas i ett AIS-meddelande är null -
      # alltså definierat, och renderas som strängen "None". Text tas med
      # `or`, tal med `is not none` - 0 kt är ett riktigt värde för ett
      # förtöjt fartyg och ska inte bytas mot ett streck.
      - type: markdown
        title: Fartyg just nu
        content: |
          {% set sh = state_attr('sensor.fartygslista', 'list') %}
          {% if sh %}
          {{ states('sensor.fartyg_sparade') }} fartyg inom
          {{ state_attr('sensor.fartygslista', 'max_distance_nm') }} nm, varav
          {{ states('sensor.fartyg_under_gang') }} under gång.

          | Fartyg | Typ | Fart | Avstånd | Mot |
          |---|---|--:|--:|---|
          {% for v in sh -%}
          | {{ v.name or v.mmsi }} | {{ v.type or '–' }} | {{ v.speed_kt if v.speed_kt is not none else '–' }} kt | {{ v.distance_nm if v.distance_nm is not none else '–' }} nm {{ v.direction or '' }} | {{ v.destination or '–' }} |
          {% endfor %}
          {% else %}
          Inget fartyg hörs just nu.
          {% endif %}

      # --- Brusgolvet: det diagnostiska diagrammet ------------------------------
      # Enda måttet som avslöjar kompression orsakad av starka signaler utanför
      # 1090 MHz. Trösklarna är uppmätta, inte gissade: gain 40.2 gav -37.7 dB
      # och 4169 avkodade meddelanden, gain 44.5 gav -28.5 dB och 709.
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          end: minute
        header:
          show: true
          title: Brusgolv
          show_states: true
          colorize_states: false
        yaxis:
          - min: -50
            max: -15
            decimals: 0
            apex_config:
              tickAmount: 5
        apex_config:
          legend:
            show: false
          chart:
            height: 240
          annotations:
            yaxis:
              - y: -35
                borderColor: '#fab219'
                strokeDashArray: 4
                label:
                  text: förhöjt
                  position: left
                  textAnchor: start
                  style:
                    background: '#fab219'
                    color: '#0b0b0b'
              - y: -30
                borderColor: '#d03b3b'
                strokeDashArray: 4
                label:
                  text: överstyrt
                  position: left
                  textAnchor: start
                  style:
                    background: '#d03b3b'
                    color: '#ffffff'
        series:
          - entity: sensor.ads_b_brusgolv
            name: Brusgolv
            color: '#2a78d6'
            type: line
            stroke_width: 2
            float_precision: 1
            group_by:
              func: avg
              duration: 5m

      # --- Avkodning ------------------------------------------------------------
      # Egen y-axel-storhet, därför eget diagram. Antalet mäter närhet mer än
      # täckning: ett flygplan rakt över ger hundratals meddelanden, tio plan
      # vid horisonten ger få.
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          end: minute
        header:
          show: true
          title: Avkodade meddelanden
          show_states: true
          colorize_states: false
        apex_config:
          legend:
            show: false
          chart:
            height: 220
        series:
          - entity: sensor.ads_b_meddelanden_per_minut
            name: Meddelanden
            color: '#2a78d6'
            type: area
            opacity: 0.15
            stroke_width: 2
            group_by:
              func: avg
              duration: 5m

      # --- Flygplan: två serier, samma storhet ----------------------------------
      # Skillnaden mellan spårade och de med position visar hur många som bara
      # hörs på Mode-S utan att positionen avkodats.
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          end: minute
        header:
          show: true
          title: Flygplan
          show_states: true
          colorize_states: true
        apex_config:
          legend:
            show: true
            position: bottom
          chart:
            height: 220
        all_series_config:
          type: line
          stroke_width: 2
          group_by:
            func: max
            duration: 5m
        series:
          - entity: sensor.flygplan_sparade
            name: Spårade
            color: '#2a78d6'
          - entity: sensor.flygplan_med_position
            name: Med position
            color: '#eb6834'

      # --- Flygplan per dygn -----------------------------------------------------
      # Dygnssummor är diskreta storheter och ritas som staplar, inte som en
      # kurva — det finns inget mellanläge mellan i går och i dag att
      # interpolera. Källan nollställs vid midnatt av räknaren på Pi:n, så
      # dygnets värde är maxvärdet inom dygnet.
      - type: custom:apexcharts-card
        graph_span: 7d
        span:
          end: day
        header:
          show: true
          title: Flygplan per dygn
          show_states: true
          colorize_states: false
        apex_config:
          legend:
            show: false
          chart:
            height: 220
          plotOptions:
            bar:
              borderRadius: 4
              columnWidth: 60%
        series:
          - entity: sensor.flygplan_i_dag
            name: Flygplan
            color: '#2a78d6'
            type: column
            group_by:
              func: max
              duration: 1d

      # --- Fartyg: två serier, samma storhet ------------------------------------
      # Skillnaden mellan spårade och de under gång visar hur mycket av
      # hamntrafiken som faktiskt rör sig. Det mesta ligger förtöjt, så den
      # undre kurvan är den som säger något om dygnsrytmen.
      # sensor.ais_sparade_objekt ritas inte: det är AIS-catchers eget tal och
      # räknar även sjömärken och basstationer, i 30 minuter efter sista
      # meddelandet. Det hör hemma som siffra, inte som kurva bredvid dessa.
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          end: minute
        header:
          show: true
          title: Fartyg
          show_states: true
          colorize_states: true
        apex_config:
          legend:
            show: true
            position: bottom
          chart:
            height: 220
        all_series_config:
          type: line
          stroke_width: 2
          group_by:
            func: max
            duration: 5m
        series:
          - entity: sensor.fartyg_sparade
            name: Spårade
            color: '#2a78d6'
          - entity: sensor.fartyg_under_gang
            name: Under gång
            color: '#eb6834'

      # --- Länkens tillgänglighet -----------------------------------------------
      # Ett på/av-tillstånd över tid är en tidslinje, inte en kurva.
      - type: history-graph
        title: Anslutning till Flightradar24
        hours_to_show: 24
        entities:
          - entity: binary_sensor.fr24_feeder_ansluten
            name: FR24

      # --- Signalstyrka ---------------------------------------------------------
      # Egen storhet (dBFS), därför skilt från brusgolvet i dB. Toppsignalen
      # visar hur starkt det närmaste planet hörs; närmar den sig 0 mättas
      # mottagaren.
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          end: minute
        header:
          show: true
          title: Toppsignal
          show_states: true
          colorize_states: false
        apex_config:
          legend:
            show: false
          chart:
            height: 200
        series:
          - entity: sensor.ads_b_toppsignal
            name: Toppsignal
            color: '#2a78d6'
            type: line
            stroke_width: 2
            float_precision: 1
            group_by:
              func: max
              duration: 5m

  # ===========================================================================
  # Bilhamnen — bilbåtarna i Göteborg
  # ===========================================================================
  # Sensorerna definieras i config/packages/bilhamnen.yaml och läses från
  # bilhamnen-tjänsten på samma Pi (se ~/project/bilhamnen). Anlöpen kommer
  # från Göteborgs Hamns API och djupgåendet från AIS via AISHub. EX60 har
  # en egen flik längre ner.
  #
  # Samma principer som feeder-vyn: nuläget som siffror, vilka fartyg som en
  # tabell, en storhet per diagram. Anlöp per vecka är diskreta antal och
  # ritas som staplar. Liggtid och djupgående ändras bara när en båt går, så
  # de ritas som trappsteg - det finns inget värde mellan två avgångar att
  # interpolera.
  - title: Bilhamnen
    path: bilhamnen
    icon: mdi:ferry
    cards:

      # --- Nuläget ---------------------------------------------------------------
      - type: glance
        title: Bilhamnen
        columns: 3
        entities:
          - entity: sensor.bilhamnen_anlop_7_dygn
            name: Anlöp 7 d
          - entity: sensor.bilhamnen_anlop_30_dygn
            name: Anlöp 30 d
          - entity: sensor.bilhamnen_fartyg_i_hamn
            name: I hamn
          - entity: sensor.bilhamnen_liggtid_median
            name: Liggtid median
          - entity: sensor.bilhamnen_liggtid_senaste
            name: Liggtid senaste
          - entity: sensor.bilhamnen_djupgaende_senaste
            name: Djupgående +/-
          - entity: sensor.bilhamnen_wallenius_30_dygn
            name: Wallenius 30 d

      # --- Vilka båtar ----------------------------------------------------------
      # Tider visas som datum och klockslag i lokal tid. Liggtiden för en båt
      # som ligger inne räknas fram till nu; den bekräftade liggtiden kommer
      # först när avgången är bekräftad.
      - type: markdown
        title: Båtarna
        content: |
          {% set fmt = '%-d/%-m %H:%M' %}
          {% set ih = state_attr('sensor.bilhamnen_fartyg_i_hamn', 'i_hamn') %}
          {% set nb = 'sensor.bilhamnen_nasta_bilbat' %}
          {% set sa = 'sensor.bilhamnen_senaste_avgang' %}
          {% set dj = 'sensor.bilhamnen_djupgaende_senaste' %}
          **Vid kaj 601**
          {% if ih %}

          | Fartyg | Agent | Ankom | Liggtid | Djupgående |
          |---|---|---|--:|--:|
          {% for v in ih -%}
          | {{ v.fartyg }} | {{ v.agent or '–' }} | {{ as_timestamp(v.ankom) | timestamp_custom(fmt) }} | {{ ((as_timestamp(now()) - as_timestamp(v.ankom)) / 3600) | round(1) }} h | {{ (v.djupgaende_m ~ ' m') if v.djupgaende_m is not none else '–' }} |
          {% endfor %}
          {% else %}
          Ingen bilbåt vid kaj.
          {% endif %}

          **Nästa**
          {% if states(nb) not in ['unknown', 'unavailable'] %}
          {{ state_attr(nb, 'fartyg') }} ({{ state_attr(nb, 'agent') or 'okänd agent' }})
          från {{ state_attr(nb, 'fran') or 'okänd hamn' }},
          {{ as_timestamp(states(nb)) | timestamp_custom(fmt) }}{{ '' if state_attr(nb, 'bekraftad') else ', planerad' }}.
          {% else %}
          Ingen väntad bilbåt i hamnens lista.
          {% endif %}

          **Senast avgången**
          {% if states(sa) not in ['unknown', 'unavailable'] %}
          {{ state_attr(sa, 'fartyg') }} till {{ state_attr(sa, 'till') or 'okänd hamn' }},
          {{ as_timestamp(states(sa)) | timestamp_custom(fmt) }}.
          {% if states(dj) not in ['unknown', 'unavailable'] and state_attr(dj, 'fartyg') == state_attr(sa, 'fartyg') %}
          Djupgående {{ state_attr(dj, 'in_m') }} m in, {{ state_attr(dj, 'ut_m') }} m ut.
          {% endif %}
          {% endif %}

      # --- Anlöp per vecka --------------------------------------------------------
      # Veckoserien kommer som attribut från Pi:n ("2026-v38"), inte som
      # sensorhistorik, så diagrammet visar åtta veckor bakåt redan från
      # första dagen. Veckonumret räknas om till veckans måndag enligt ISO 8601.
      - type: custom:apexcharts-card
        graph_span: 8w
        span:
          end: isoWeek
        header:
          show: true
          title: Anlöp per vecka
          show_states: false
        apex_config:
          legend:
            show: false
          chart:
            height: 220
          plotOptions:
            bar:
              borderRadius: 4
              columnWidth: 60%
        series:
          - entity: sensor.bilhamnen_anlop_7_dygn
            name: Anlöp
            color: '#2a78d6'
            type: column
            data_generator: |
              const monday = (y, w) => {
                const d = new Date(Date.UTC(y, 0, 4));
                d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() || 7) - 1) + (w - 1) * 7);
                return d.getTime();
              };
              return (entity.attributes.per_vecka || []).map(v => {
                const [y, w] = v.vecka.split('-v').map(Number);
                return [monday(y, w), v.anlop];
              });

      # --- Liggtid ---------------------------------------------------------------
      - type: custom:apexcharts-card
        graph_span: 30d
        span:
          end: day
        header:
          show: true
          title: Liggtid vid kaj, senaste båt
          show_states: true
          colorize_states: false
        apex_config:
          legend:
            show: false
          chart:
            height: 200
        series:
          - entity: sensor.bilhamnen_liggtid_senaste
            name: Liggtid
            color: '#2a78d6'
            type: line
            curve: stepline
            stroke_width: 2

      # --- Djupgående ------------------------------------------------------------
      # Hur mycket djupare båten gick ut än in. Positivt betyder lastad.
      - type: custom:apexcharts-card
        graph_span: 30d
        span:
          end: day
        header:
          show: true
          title: Djupgående ut minus in
          show_states: true
          colorize_states: false
        apex_config:
          legend:
            show: false
          chart:
            height: 200
          annotations:
            yaxis:
              - y: 0
                borderColor: '#8a8a8a'
                strokeDashArray: 4
        series:
          - entity: sensor.bilhamnen_djupgaende_senaste
            name: Djupgående
            color: '#2a78d6'
            type: line
            curve: stepline
            stroke_width: 2

      # --- Agenter ---------------------------------------------------------------
      # Vem som lastar säger vart bilarna går: Wallenius Wilhelmsen kör
      # långlinjerna, CEVA och Scandinavia Shipping mest Europa.
      - type: markdown
        title: Agenter senaste 30 dygn
        content: |
          {% set ag = state_attr('sensor.bilhamnen_anlop_7_dygn', 'per_agent_30d') %}
          {% if ag %}
          | Agent | Anlöp |
          |---|--:|
          {% for name, n in ag.items() -%}
          | {{ name }} | {{ n }} |
          {% endfor %}
          {% else %}
          Inga anlöp senaste 30 dygn.
          {% endif %}

          <sub>Data från {{ as_timestamp(state_attr('sensor.bilhamnen_anlop_7_dygn', 'genererad')) | timestamp_custom('%-d/%-m %H:%M') }}.</sub>

  # ===========================================================================
  # EX60 — produktion och leveranser
  # ===========================================================================
  # Tre avdelningar, en fråga var, i den ordning de ska läsas:
  #   1. Produktion: hur fort bygger Torslanda? (löpnummer ur VIN)
  #   2. Leveranser i Europa: hur går registreringarna, land mot land?
  #   3. Detaljer: dagsserier, danska löpnummer och källor.
  # Avdelningsvy (type: sections) i stället för masonry, så att ordningen
  # och avdelningarna hålls ihop på både dator och mobil.
  #
  # Länderna har fasta färger ur en validerad kategorisk palett (mörka
  # steg, kontrollerade mot HA:s mörka kortyta: sämsta intilliggande par
  # ΔE 8,4 vid färgblindhet och 19,3 vid normalt seende). Ordningen följer
  # reg_per_manad från Pi:n och byts aldrig, så ett land har alltid samma
  # färg:
  #   SE #3987e5  NO #d95926  DK #199e70  FI #c98500  NL #d55181  DE #008300
  # Identitet bärs aldrig av färgen ensam: diagrammen har förklaring och
  # tabellen under visar samma siffror.
  - title: EX60
    path: ex60
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    sections:

      # --- 1. Produktion --------------------------------------------------------
      # Fyra siffror i rutor (två och två på mobil), och slutsatsen i
      # klartext under, med förbehållet om hur få punkter takten vilar på.
      - type: grid
        cards:
          - type: heading
            heading: Produktion
            heading_style: title
            icon: mdi:factory
          - type: tile
            entity: sensor.ex60_hogsta_kanda_lopnummer
            name: Högsta löpnummer
            vertical: true
          - type: tile
            entity: sensor.ex60_takt_nu
            name: Takt nu
            vertical: true
          - type: tile
            entity: sensor.ex60_uppskattat_lopnummer_i_dag
            name: Uppskattat i dag
            vertical: true
          - type: tile
            entity: sensor.ex60_kravs_per_dag_for_malet
            name: Krävs för målet
            vertical: true
          - type: markdown
            content: |
              {% set h = 'sensor.ex60_hogsta_kanda_lopnummer' %}
              {% set t = 'sensor.ex60_takt_nu' %}
              {% set u = 'sensor.ex60_uppskattat_lopnummer_i_dag' %}
              {% set k = 'sensor.ex60_kravs_per_dag_for_malet' %}
              {% set bad = ['unknown', 'unavailable'] %}
              {% if states(t) not in bad %}
              Torslanda bygger ≈ **{{ states(t) | round(0) | int }} EX60 per dag**, räknat ur {{ state_attr(t, 'lopnr_takt_punkter') }} bilar med känt byggdatum{% if state_attr(u, 'lopnr_framskrivet_fran') %} (senast {{ as_timestamp(state_attr(u, 'lopnr_framskrivet_fran')) | timestamp_custom('%-d/%-m') }}){% endif %}.
              {% else %}
              Takten går inte att räkna ut: det behövs minst två bilar med byggdatum.
              {% endif %}
              {% if states(k) not in bad %}
              Målet {{ '{:,}'.format(state_attr(k, 'lopnr_mal') or 40000).replace(',', ' ') }} i år kräver ≈ **{{ states(k) }} per dag**{% if state_attr(k, 'lopnr_kravs_ganger_takten') %}, {{ state_attr(k, 'lopnr_kravs_ganger_takten') | replace('.', ',') }} × dagens takt{% endif %}.
              {% endif %}
              {% if states(h) not in bad %}
              Högsta kända löpnummer är #{{ '%06d' | format(states(h) | int) }} ({{ state_attr(h, 'typ') or '' }} {{ as_timestamp(state_attr(h, 'datum')) | timestamp_custom('%-d/%-m') if state_attr(h, 'datum') else '' }}{{ (', ' ~ state_attr(h, 'land')) if state_attr(h, 'land') else '' }}).
              {% endif %}

      # --- 2. Leveranser i Europa ---------------------------------------------
      # Ett diagram där länderna går att jämföra: registreringar per månad,
      # samma skala, en stapel per land och månad. Dagsdata är summerade per
      # månad på Pi:n; en månad utan data (Finland och Tyskland ligger en
      # månad efter) saknar stapel i stället för att visa noll.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Leveranser i Europa
            heading_style: title
            icon: mdi:earth
          - type: custom:apexcharts-card
            graph_span: 6month
            span:
              end: month
            header:
              show: true
              title: Nyregistreringar per månad
              show_states: false
            apex_config:
              chart:
                height: 280
              legend:
                show: true
                position: bottom
              plotOptions:
                bar:
                  borderRadius: 4
                  borderRadiusApplication: end
                  columnWidth: 75%
              stroke:
                show: true
                width: 2
                colors: ['transparent']
              tooltip:
                shared: true
                intersect: false
            all_series_config:
              type: column
            series:
              - entity: sensor.ex60_registreringar_i_europa
                name: Sverige
                color: '#3987e5'
                data_generator: |
                  const m = entity.attributes.reg_manader || [];
                  const v = (entity.attributes.reg_per_manad || {}).SE || [];
                  return m.map((x, i) => [new Date(x + '-15T12:00:00').getTime(), v[i] ?? null]);
              - entity: sensor.ex60_registreringar_i_europa
                name: Norge
                color: '#d95926'
                data_generator: |
                  const m = entity.attributes.reg_manader || [];
                  const v = (entity.attributes.reg_per_manad || {}).NO || [];
                  return m.map((x, i) => [new Date(x + '-15T12:00:00').getTime(), v[i] ?? null]);
              - entity: sensor.ex60_registreringar_i_europa
                name: Danmark
                color: '#199e70'
                data_generator: |
                  const m = entity.attributes.reg_manader || [];
                  const v = (entity.attributes.reg_per_manad || {}).DK || [];
                  return m.map((x, i) => [new Date(x + '-15T12:00:00').getTime(), v[i] ?? null]);
              - entity: sensor.ex60_registreringar_i_europa
                name: Finland
                color: '#c98500'
                data_generator: |
                  const m = entity.attributes.reg_manader || [];
                  const v = (entity.attributes.reg_per_manad || {}).FI || [];
                  return m.map((x, i) => [new Date(x + '-15T12:00:00').getTime(), v[i] ?? null]);
              - entity: sensor.ex60_registreringar_i_europa
                name: Nederländerna
                color: '#d55181'
                data_generator: |
                  const m = entity.attributes.reg_manader || [];
                  const v = (entity.attributes.reg_per_manad || {}).NL || [];
                  return m.map((x, i) => [new Date(x + '-15T12:00:00').getTime(), v[i] ?? null]);
              - entity: sensor.ex60_registreringar_i_europa
                name: Tyskland
                color: '#008300'
                data_generator: |
                  const m = entity.attributes.reg_manader || [];
                  const v = (entity.attributes.reg_per_manad || {}).DE || [];
                  return m.map((x, i) => [new Date(x + '-15T12:00:00').getTime(), v[i] ?? null]);

          # Samma siffror som tabell, med samma kolumner för alla länder.
          # "Senaste" är 30 dagar för länder med dagsdata, annars den senaste
          # publicerade månaden - kolumnen säger vilket.
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set e = 'sensor.ex60_registreringar_i_europa' %}
              {% set rows = state_attr(e, 'reg_tabell') or [] %}
              {% set mon = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'] %}
              {% macro dag(d) -%}
              {%- if d | length == 10 -%}{{ d[8:10] | int }}/{{ d[5:7] | int }}{%- else -%}{{ mon[(d[5:7] | int) - 1] }}{%- endif -%}
              {%- endmacro %}
              {% if rows %}
              | Land | Totalt | Senaste | Data t.o.m. |
              |:--|--:|--:|:--|
              {% for r in rows -%}
              | {{ r.namn }} | {{ r.totalt }} | {{ r.senaste if r.senaste is not none else '–' }} <sub>{{ r.senaste_avser if 'dagar' in r.senaste_avser or 'månad' in r.senaste_avser else mon[(r.senaste_avser[5:7] | int) - 1] }}</sub> | {{ dag(r.till_och_med) }} |
              {% endfor %}

              {% for r in rows if r.anm -%}
              <sub>{{ r.namn }}: {{ r.anm }}.</sub>
              {% endfor %}
              {% else %}
              Inga registreringsdata än.
              {% endif %}

      # --- 3. Detaljer --------------------------------------------------------
      # Dagsserierna för länderna med dagsdata i ett diagram med samma skala
      # och samma färger som ovan, de högsta danska löpnumren och källorna.
      - type: grid
        cards:
          - type: heading
            heading: Detaljer
            heading_style: title
            icon: mdi:magnify
          - type: custom:apexcharts-card
            graph_span: 60d
            span:
              end: day
            header:
              show: true
              title: Nyregistreringar per dag
              show_states: false
            apex_config:
              chart:
                height: 220
                stacked: true
              legend:
                show: true
                position: bottom
              plotOptions:
                bar:
                  borderRadius: 2
                  columnWidth: 80%
              tooltip:
                shared: true
                intersect: false
            all_series_config:
              type: column
            series:
              - entity: sensor.ex60_registrerade_i_sverige
                name: Sverige
                color: '#3987e5'
                data_generator: |
                  return (entity.attributes.nyreg_per_dag || []).map(d =>
                    [new Date(d.dag + 'T12:00:00').getTime(), d.antal]);
              - entity: sensor.ex60_i_norge
                name: Norge
                color: '#d95926'
                data_generator: |
                  return (entity.attributes.no_per_dag || []).map(d =>
                    [new Date(d.dag + 'T12:00:00').getTime(), d.antal]);
              - entity: sensor.ex60_i_nederlanderna
                name: Nederländerna
                color: '#d55181'
                data_generator: |
                  return (entity.attributes.nl_per_dag || []).map(d =>
                    [new Date(d.dag + 'T12:00:00').getTime(), d.antal]);

          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set e = 'sensor.ex60_i_danmark' %}
              {% set cars = state_attr(e, 'dk_bilar') %}
              **Högsta danska löpnummer**
              {% if cars %}
              | Löpnummer | Status | Datum |
              |--:|:--|:--|
              {% for c in (cars | sort(attribute='lopnummer', reverse=true))[:5] -%}
              | #{{ '%06d' | format(c.lopnummer) }} | {{ 'registrerad' if c.status == 'Registreret' else 'inlagd' }} | {{ as_timestamp(c.datum) | timestamp_custom('%-d/%-m') if c.datum else '–' }} |
              {% endfor %}

              <sub>Alla löpnummer: [EX60 Löpnummer](https://claude.ai/artifact/SxxqEXURW7MjnwVb4KCayP).</sub>
              {% else %}
              Ingen dansk registerfil läst än.
              {% endif %}

          - type: markdown
            grid_options:
              columns: full
            content: |
              <sub>Källor: Sverige car.info (Transportstyrelsen), dagligen.
              Norge elbilstatistikk.no, dagligen. Danmark Skattestyrelsens
              motorregister, veckovis. Finland Traficom, månadsvis.
              Nederländerna RDW öppen data, dagligen. Tyskland KBA FZ 10,
              månadsvis. Löpnummer och produktionstakt från punkterna på
              löpnummersidan.</sub>
